events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Increase max body size for uploads (e.g., media files to Next.js or Minio)
    client_max_body_size 100M;

    server {
        listen 80;
        server_name localhost;

        # Proxy requests to /s3/ to Minio API
        location /s3/ {
            # Remove the /s3/ prefix when passing to Minio
            rewrite ^/s3/(.*) /$1 break;
            
            proxy_pass http://minio:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # To support websocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Disable buffering for Minio
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Proxy all other requests to the Next.js app
        location / {
            proxy_pass http://app:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # To support websocket for NextJS HMR (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
