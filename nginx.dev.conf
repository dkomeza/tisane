events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Increase max body size for uploads (e.g., media files to Next.js or Minio)
    client_max_body_size 100M;

    # Docker internal DNS resolver to prevent caching old IPs when containers restart
    resolver 127.0.0.11 valid=30s;

    # S3 (Minio) — served via s3.localhost subdomain
    server {
        listen 80;
        server_name s3.localhost;

        location / {
            set $upstream_minio minio;
            proxy_pass http://$upstream_minio:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # Next.js app — served via localhost
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://host.docker.internal:3001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for Next.js HMR (Hot Module Replacement)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
