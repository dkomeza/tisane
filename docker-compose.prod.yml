services:
  app:
    container_name: prod_tisane
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    image: ghcr.io/dkomeza/tisane:latest
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - tisane_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/admin/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrator:
    container_name: prod_tisane_migrator
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    image: ghcr.io/dkomeza/tisane-builder:latest
    env_file:
      - .env
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tisane_net
    restart: "no"

  watchtower:
    container_name: prod_tisane_watchtower
    image: containrrr/watchtower
    command: --http-api-update --label-enable
    environment:
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tisane_net
    restart: unless-stopped

  db:
    container_name: prod_tisane_postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tisane_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    container_name: prod_tisane_minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - tisane_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio_init:
    container_name: prod_tisane_minio_init
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - tisane_net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/$${S3_BUCKET} || true &&
      mc anonymous set none local/$${S3_BUCKET}
      "
    restart: "no"

  proxy:
    container_name: prod_tisane_proxy
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      app:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - tisane_net

volumes:
  pgdata:
  minio_data:

networks:
  tisane_net:
    driver: bridge
